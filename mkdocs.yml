site_name: Software Quality
site_url: https://uberblah.github.io/software-quality
site_description: A personal aggregation of software engineering best practices, templates, patterns, and principles
site_author: uberblah

repo_url: https://github.com/uberblah/software-quality
repo_name: uberblah/software-quality
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Ubuntu
    code: Ubuntu Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
    - toc.follow

plugins:
  - search
  - kroki:
      ServerURL: https://kroki.io
      FencePrefix: ""
      EnableBlockDiag: true
      EnableBpmn: true
      EnableExcalidraw: true
      EnableMermaid: false
      FileTypes:
        - png
        - svg

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Project Lifecycle:
      - Overview: project-lifecycle/index.md
      - Requirements Gathering: project-lifecycle/requirements-gathering.md
      - Design: project-lifecycle/design.md
      - Planning: project-lifecycle/planning.md
      - Implementation: project-lifecycle/implementation.md
      - Release: project-lifecycle/release.md
      - Operation: project-lifecycle/operation.md
      - Deprecation: project-lifecycle/deprecation.md
  - Standards:
      - Overview: standards/index.md
      - Design Template: standards/design-template.md
  - Principles:
      - Overview: principles/index.md
      - Higher Judgment & Direction:
          - Solve the Right Problem: principles/solve-the-right-problem.md
          - What Ownership Is: principles/what-ownership-is.md
          - If It's Not Written, It's Not Happening: principles/if-its-not-written-its-not-happening.md
          - The Problem with Deprecation: principles/the-problem-with-deprecation.md
      - Designing Solutions:
          - Separate Concerns: principles/separation-of-concerns.md
          - Design Incrementally: principles/design-incrementally.md
          - The Automation Spectrum: principles/the-automation-spectrum.md
          - Leaf vs Root Problems: principles/leaf-vs-root-problems.md
          - O(1) Effort per Change: principles/o1-effort-per-change.md
          - If They Can, They Will: principles/if-they-can-they-will.md
          - Boring is Good: principles/boring-is-good.md
          - Do Not Repeat Yourself: principles/do-not-repeat-yourself.md
          - Minimize Interfaces: principles/minimize-interfaces.md
          - Clean Abstractions: principles/clean-abstractions.md
          - Isolate Complexity: principles/isolate-complexity.md
          - Expect Change: principles/expect-change.md
          - Minimize Dependencies: principles/minimize-dependencies.md
      - Code Quality:
          - The Rule of Two: principles/the-rule-of-two.md
          - Tests Or It Isn't Done: principles/tests-or-it-isnt-done.md
          - Isolate Tests: principles/isolate-tests.md
  - Design Patterns:
      - Overview: design-patterns/index.md
      - Clean Plugin Architecture: design-patterns/plugin-architecture.md
  - System Archetypes:
      - Overview: system-archetypes/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/uberblah/software-quality

extra_css:
  - stylesheets/extra.css
